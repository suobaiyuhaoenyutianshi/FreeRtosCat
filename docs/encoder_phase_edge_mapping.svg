<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 175" width="720" height="175" role="img" aria-labelledby="title desc">
  <title id="title">A 相边沿与 phase 的对应关系</title>
  <desc id="desc">上升沿后 A 为高电平，phase=1，刚结束的是低电平段；下降沿后 A 为低电平，phase=0，刚结束的是高电平段。</desc>

  <rect x="0" y="0" width="720" height="175" rx="12" fill="#F7F7F8"/>
  <rect x="0.5" y="0.5" width="719" height="174" rx="12" fill="none" stroke="#D9D9DE"/>

  <!-- 电平标注 -->
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#52525B">
    <text x="150" y="96" text-anchor="end">A 相</text>
    <text x="166" y="74" text-anchor="end">高</text>
    <text x="166" y="124" text-anchor="end">低</text>
  </g>

  <!-- 边沿辅助线与标题 -->
  <g stroke="#52525B" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 4">
    <line x1="300" y1="48" x2="300" y2="140"/>
    <line x1="460" y1="48" x2="460" y2="140"/>
  </g>
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#52525B" text-anchor="middle">
    <text x="300" y="36">① 上升沿</text>
    <text x="460" y="36">② 下降沿</text>
  </g>

  <!-- A 相波形 -->
  <path d="M180 120 H300 V70 H460 V120 H620" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 边沿点 -->
  <circle cx="300" cy="70" r="11" fill="#F7F7F8" stroke="#0FDC78" stroke-width="2"/>
  <circle cx="460" cy="120" r="11" fill="#F7F7F8" stroke="#0FDC78" stroke-width="2"/>
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="500" fill="#004D26" text-anchor="middle">
    <text x="300" y="74">1</text>
    <text x="460" y="124">2</text>
  </g>

  <!-- phase 标注 -->
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="500" fill="#004D26">
    <text x="314" y="60">phase = 1</text>
    <text x="474" y="108">phase = 0</text>
  </g>

  <!-- 刚结束的电平段 -->
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" fill="#52525B" text-anchor="middle">
    <text x="240" y="158">① 刚结束：低电平</text>
    <text x="380" y="158">② 刚结束：高电平</text>
  </g>
</svg>
